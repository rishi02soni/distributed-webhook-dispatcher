
databases:
  - name: webhook-dispatcher-db
    plan: free
    databaseName: webhook_dispatcher
    user: webhook_dispatcher

services:
  - type: web
    name: webhook-dispatcher-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-dispatcher-db
          property: connectionString
      - key: DISPATCH_API_KEY
        generateValue: true
      - key: ALLOW_PRIVATE_DESTINATIONS
        value: "false"
